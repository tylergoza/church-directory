# Puts a backup from `make backup` on the apps box: the database and secrets.key,
# owned by the service user, mode 0600, and photos.tgz unpacked into the photos/
# folder (replaced, not merged, so it matches the backup). Refuses if the box
# already has a database, unless FORCE=true, which first takes a pre-restore
# backup of the database, key and photos on the box.
# Run `make provision RESTORE_PENDING=true` first, so the app hasn't started and
# made an empty database.
#
#   with-do-church make restore BACKUP=latest      # or BACKUP=<dir>
#   with-do-church make restore BACKUP=latest FORCE=true

- name: Find the backup and the droplet
  hosts: localhost
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  tasks:
    - name: Check the account
      ansible.builtin.include_tasks: tasks/check_account.yml

    - name: Find the droplets
      ansible.builtin.include_tasks: tasks/find_droplets.yml

    - name: Check there's somewhere to restore to
      ansible.builtin.assert:
        that: groups['app'] | default([]) | length > 0
        fail_msg: No droplets are tagged {{ do_tag }}. Run provision.yml first.
        quiet: true

    - name: Find the newest backup
      ansible.builtin.find:
        paths: "{{ local_backup_dir | expanduser }}/church-directory"
        file_type: directory
      register: backups
      when: backup | default('latest') == 'latest'

    - name: Pick the backup
      ansible.builtin.set_fact:
        backup_dir: >-
          {{ (backups.files | sort(attribute='path') | last).path if backup | default('latest') == 'latest'
             else backup | expanduser }}

    - name: Read the manifest
      ansible.builtin.set_fact:
        manifest: "{{ lookup('ansible.builtin.file', backup_dir ~ '/manifest.yml') | from_yaml }}"

    - name: Check it's this app's backup
      ansible.builtin.assert:
        that: manifest.app == 'church-directory' and 'directory.db' in manifest.files
        fail_msg: "{{ backup_dir }} isn't a church-directory backup."
        quiet: true

    - name: Checksum the files
      ansible.builtin.stat:
        path: "{{ backup_dir }}/{{ item.key }}"
        checksum_algorithm: sha256
      loop: "{{ manifest.files | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: sums

    - name: Check they match the manifest
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.checksum == item.item.value
        fail_msg: "{{ backup_dir }}/{{ item.item.key }} doesn't match its manifest."
        quiet: true
      loop: "{{ sums.results }}"
      loop_control:
        label: "{{ item.item.key }}"

- name: Install the backup
  hosts: app
  gather_facts: false
  vars_files: [defaults.yml, vars.yml]
  vars:
    backup_dir: "{{ hostvars.localhost.backup_dir }}"
    manifest: "{{ hostvars.localhost.manifest }}"
    directory: [runuser, -u, directory, --, /usr/local/bin/church-directory, -db, "{{ app_db }}"]
  tasks:
    - name: Check the app is installed
      ansible.builtin.stat:
        path: /etc/systemd/system/church-directory.service
      register: unit
      failed_when: not unit.stat.exists

    - name: Look for an existing database
      ansible.builtin.stat:
        path: "{{ app_db }}"
      register: db

    - name: Look for existing photos
      ansible.builtin.stat:
        path: "{{ app_data_dir }}/photos"
      register: photos_dir

    - name: Don't overwrite it by accident
      ansible.builtin.assert:
        that: not db.stat.exists or force | default(false) | bool
        fail_msg: >-
          {{ inventory_hostname }} already has a database. Use FORCE=true to replace it
          (a pre-restore backup is kept on the box).
        quiet: true

    # One stem, fixed here, so the database, key and photos of a pre-restore
    # backup share it.
    - name: Name the pre-restore backup
      ansible.builtin.set_fact:
        stem: "{{ app_backup_dir ~ '/pre-restore-' ~ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"

    - name: Take a pre-restore backup
      when: db.stat.exists
      block:
        - name: Back up the database
          ansible.builtin.command:
            argv: "{{ directory + ['backup', stem ~ '.db'] }}"
          changed_when: true

        - name: Check for the secrets key
          ansible.builtin.stat:
            path: "{{ app_data_dir }}/secrets.key"
          register: old_key

        - name: Back up the secrets key
          ansible.builtin.copy:
            src: "{{ app_data_dir }}/secrets.key"
            dest: "{{ stem ~ '.key' }}"
            remote_src: true
            owner: directory
            group: directory
            mode: "0600"
          when: old_key.stat.exists

    # The restore replaces the photos folder, so keep what is there. tar exits 1
    # when a file changed while it was read; that's a warning.
    - name: Back up the existing photos
      ansible.builtin.command:
        argv: [tar, -czf, "{{ stem ~ '.photos.tar.gz' }}", -C, "{{ app_data_dir }}", photos]
      register: photos_archive
      failed_when: photos_archive.rc not in [0, 1]
      changed_when: true
      when: photos_dir.stat.exists and 'photos.tgz' in manifest.files

    - name: Stop the app
      ansible.builtin.systemd_service:
        name: church-directory
        state: stopped

    # photos.tgz is not copied in like these: it is unpacked below.
    - name: Install the files
      ansible.builtin.copy:
        src: "{{ backup_dir }}/{{ item }}"
        dest: "{{ app_data_dir }}/{{ item }}"
        owner: directory
        group: directory
        mode: "0600"
      loop: "{{ manifest.files.keys() | reject('eq', 'photos.tgz') | list }}"

    # A backup with no photos.tgz (the source had no photos folder) leaves the
    # box's photos alone: nothing is deleted without something to put there.
    - name: Replace the photos
      when: "'photos.tgz' in manifest.files"
      block:
        - name: Remove the existing photos folder
          ansible.builtin.file:
            path: "{{ app_data_dir }}/photos"
            state: absent

        - name: Unpack the photos
          ansible.builtin.unarchive:
            src: "{{ backup_dir }}/photos.tgz"
            dest: "{{ app_data_dir }}"
            owner: directory
            group: directory

        # The archive may carry another box's user ids; make the result the
        # service user's, as the app writes it (folder 0750, files 0640).
        - name: Give the service user the photos
          ansible.builtin.file:
            path: "{{ app_data_dir }}/photos"
            state: directory
            recurse: true
            owner: directory
            group: directory
            mode: u=rwX,g=rX,o=

    - name: Remove stale write-ahead files
      ansible.builtin.file:
        path: "{{ app_db }}{{ item }}"
        state: absent
      loop: [-wal, -shm]

    - name: Rewrite saved addresses
      ansible.builtin.include_tasks: tasks/rewrite_addresses.yml
      vars:
        rewrite_sqlite: [runuser, -u, directory, --, sqlite3]
      when: address_rewrites | length > 0

    - name: Start the app
      ansible.builtin.systemd_service:
        name: church-directory
        enabled: true
        state: started
        daemon_reload: true

    # Migrations run on start, so give it a while.
    - name: Wait for the app to answer
      ansible.builtin.uri:
        url: http://{{ private_ip }}:{{ app_port }}/healthz
      register: health
      until: health.status == 200
      retries: 30
      delay: 2

    - name: Done
      ansible.builtin.debug:
        msg: "Restored {{ backup_dir | basename }} to {{ inventory_hostname }}."
